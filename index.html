<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1319">
<meta name="mobile-web-app-capable" content="yes">
<title>Kitchen Hub</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg: #070a10;
    --glass: rgba(255, 255, 255, .055);
    --glass-2: rgba(255, 255, 255, .07);
    --edge: rgba(255, 255, 255, .09);
    --edge-hi: rgba(255, 255, 255, .16);
    --text: #f5f7fa;
    --soft: rgba(235, 241, 248, .82);
    --muted: rgba(225, 232, 240, .70);
    --accent: #d9bf8f;
    --rain: #7dbcff;
    --ok: #5fd39a;
    --warn: #f5a524;
    --red: #ff4d55;
    --r: 3.2vh;
    --blur: blur(28px) saturate(150%);
    /* background glow colours, changed by the weather ("mood") */
    --g1: #c9862a; --g2: #1f6f8b; --g3: #3b2a6e;
  }
  body[data-mood="sun"]   { --g1: #d08a2a; --g2: #1d6f86; --g3: #47306f; }
  body[data-mood="cloud"] { --g1: #55657e; --g2: #2c4a6b; --g3: #3d3a5c; }
  body[data-mood="rain"]  { --g1: #23548c; --g2: #1f3d66; --g3: #2b5a6e; }
  body[data-mood="storm"] { --g1: #4a3a8a; --g2: #1f2f5c; --g3: #6b2a4a; }
  body[data-mood="fog"]   { --g1: #6c7480; --g2: #3e4a58; --g3: #4b4f63; }
  body[data-mood="night"] { --g1: #26306e; --g2: #13405a; --g3: #3a2160; }

  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text); overflow: hidden; }
  body { position: fixed; inset: 0; }
  body {
    font-family: Inter, Roboto, "Segoe UI", system-ui, sans-serif;
    font-feature-settings: "cv11" 1;
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none; user-select: none; cursor: none; touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  /* Ambient glow behind everything: three big soft blobs that slowly change colour with the weather. */
  .aura { position: fixed; inset: 0; overflow: hidden; z-index: 0; pointer-events: none; }
  .aura i { position: absolute; border-radius: 50%; filter: blur(12vh); opacity: .55; transition: background-color 8s ease; }
  .aura i:nth-child(1) { width: 70vw; height: 80vh; left: -18vw; top: -30vh; background-color: var(--g1); opacity: .42; }
  .aura i:nth-child(2) { width: 60vw; height: 75vh; right: -20vw; top: 25vh; background-color: var(--g2); }
  .aura i:nth-child(3) { width: 55vw; height: 60vh; left: 15vw; bottom: -38vh; background-color: var(--g3); opacity: .45; }
  .aura::after { content: ""; position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 40%, transparent 30%, rgba(4,6,10,.55) 100%); }

  main {
    position: relative; z-index: 1;
    height: 100%; padding: 3vh 2.4vw 1.4vh;
    display: grid; gap: 2.4vh 1.8vw;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr);
    grid-template-rows: auto minmax(0, 1fr) auto;
    grid-template-areas: "clock now" "news live" "status status";
    animation: fadein 1.6s ease both;
  }
  .panel {
    background: linear-gradient(160deg, var(--glass-2), rgba(255,255,255,.025));
    border: 1px solid var(--edge); border-top-color: var(--edge-hi);
    border-radius: var(--r); min-height: 0; overflow: hidden;
    -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
    box-shadow: 0 2vh 6vh rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.05);
  }
  @keyframes fadein { from { opacity: 0; } }
  @keyframes rise { from { opacity: 0; transform: translateY(1.2vh); } }

  /* Clock (no box: floats on the glow) */
  .clock { grid-area: clock; display: flex; flex-direction: column; justify-content: center; padding-left: .4vw; }
  #time, #nowTemp, .day .hl, .status { font-variant-numeric: tabular-nums; }
  #time { font-size: 19vh; font-weight: 600; line-height: .9; letter-spacing: -.035em;
          background: linear-gradient(180deg, #fff 40%, rgba(255,255,255,.85)); -webkit-background-clip: text; background-clip: text; color: transparent;
          transition: opacity .6s ease; }
  #time.tick { opacity: .7; transition: none; }
  #time .ampm { font-size: 6vh; font-weight: 500; -webkit-text-fill-color: var(--muted); margin-left: .8vw; letter-spacing: 0; }
  .sub { display: flex; align-items: baseline; gap: 1.1vw; margin-top: 1.6vh; white-space: nowrap; }
  #date { font-size: 4vh; font-weight: 500; color: var(--soft); }
  #town { font-size: 2.8vh; font-weight: 600; color: var(--accent); }

  /* Weather */
  .now.panel { border: 0; border-radius: 4vh; background: linear-gradient(160deg, rgba(255,255,255,.085), rgba(255,255,255,.02) 65%);
               box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 3vh 8vh rgba(0,0,0,.25); }
  .live.panel { border: 0; border-radius: 4vh; box-shadow: 0 3vh 8vh rgba(0,0,0,.3); }
  .now { grid-area: now; display: flex; flex-direction: column; padding: 2.2vh 1.8vw 2vh; gap: 1.6vh; }
  .cur { display: flex; align-items: center; gap: 1.4vw; }
  #nowIcon { font-size: 9.5vh; line-height: 1; filter: drop-shadow(0 .6vh 2vh rgba(255,190,80,.25)); }
  #nowTemp { font-size: 11vh; font-weight: 600; line-height: .9; letter-spacing: -.03em; }
  #nowTemp small { font-size: 5vh; color: var(--muted); font-weight: 500; vertical-align: top; margin-left: .2vw; }
  #nowCond { font-size: 3.4vh; font-weight: 500; line-height: 1.25; margin-left: .6vw; }
  #nowCond span { color: var(--muted); font-weight: 400; }
  .days { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding-top: 1.6vh; position: relative; }
  .days::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--edge-hi) 20%, var(--edge-hi) 80%, transparent); }
  .day { display: grid; grid-template-columns: auto 1fr; column-gap: .9vw; align-items: center; justify-content: center; padding: 0 .6vw; min-width: 0; position: relative; }
  .day + .day::before { content: ""; position: absolute; left: 0; top: 15%; bottom: 15%; width: 1px; background: linear-gradient(180deg, transparent, var(--edge-hi), transparent); }
  .day .i { grid-row: 1 / 3; font-size: 4.6vh; line-height: 1; }
  .day .n { font-size: 2.3vh; font-weight: 600; color: var(--muted); }
  .day.today .n { color: var(--accent); }
  .day .hl { font-size: 2.9vh; font-weight: 600; white-space: nowrap; }
  .day .hl span { color: var(--muted); font-weight: 400; }
  /* Air line: air quality always, dust and UV only when they matter */
  .air { display: flex; flex-wrap: wrap; gap: .4vh 1.6vw; font-size: 2.5vh; font-weight: 500; color: var(--soft); min-height: 2.5vh; }
  .air:empty { display: none; }
  .air > span { display: inline-flex; align-items: center; gap: .6vw; white-space: nowrap; }
  .air .dot { width: 1.3vh; height: 1.3vh; border-radius: 50%; background: var(--c); box-shadow: 0 0 1.2vh var(--c); }
  .day .p { color: var(--rain); font-size: 2vh; font-weight: 600; margin-left: .4vw; letter-spacing: 0; }

  /* News: no hard lines, soft fade at the bottom edge */
  .news.panel { background: none; border: 0; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; border-radius: 0;
                -webkit-mask-image: linear-gradient(180deg, #000 90%, transparent); mask-image: linear-gradient(180deg, #000 90%, transparent); }
  .news { grid-area: news; padding: .4vh .4vw; display: flex; flex-direction: column; justify-content: space-evenly; }
  .item { padding: .9vh 0; min-width: 0; position: relative; }
  .item + .item::before { content: ""; position: absolute; top: 0; left: 0; right: 30%; height: 1px; background: linear-gradient(90deg, var(--edge-hi), transparent); }
  .news.fresh .item { animation: rise .9s cubic-bezier(.2,.7,.2,1) both; }
  .news.fresh .item:nth-child(2) { animation-delay: .08s; } .news.fresh .item:nth-child(3) { animation-delay: .16s; }
  .news.fresh .item:nth-child(4) { animation-delay: .24s; } .news.fresh .item:nth-child(5) { animation-delay: .32s; }
  .item .h { font-size: 3.4vh; font-weight: 500; line-height: 1.22; letter-spacing: -.005em;
             display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .item .m { display: flex; align-items: center; gap: .6vw; font-size: 2.3vh; color: var(--muted); margin-top: .6vh; }
  .item .m b { color: var(--accent); font-weight: 600; }
  .item .m .lang { font-style: normal; font-size: 1.5vh; font-weight: 700; color: var(--soft); background: rgba(255,255,255,.08);
                   border-radius: .6vh; padding: .15vh .45vw; letter-spacing: .06em; }
  .item.fresh .m::before { content: ""; flex: none; width: 1.1vh; height: 1.1vh; border-radius: 50%; background: var(--accent); box-shadow: 0 0 1vh var(--accent); }
  .item .m .lang { display: none; }
  .empty { color: var(--muted); font-size: 2.8vh; margin: auto; text-align: center; }

  /* Live news: the video fills the box; controls float on a soft fade at the bottom. */
  .live { grid-area: live; position: relative; background: #000; }
  /* Video sits at the top at its own 16:9 shape; its bottom edge melts into the controls. */
  #livePlayer { position: absolute; left: -7.5%; right: -7.5%; top: 0; aspect-ratio: 16 / 9; background: #000; }
  #livePlayer iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; pointer-events: none; }
  #livePlayer::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 35%; pointer-events: none;
                       background: linear-gradient(180deg, transparent, rgba(0,0,0,.5) 55%, #000); }
  .bn { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 1vw;
        padding: 2vh 1.2vw 1.6vh 1.6vw;
        background: transparent; }
  .bn b { flex: none; display: flex; align-items: center; gap: .55vw; font-size: 2.2vh; font-weight: 600; color: #fff; }
  .bn b::before { content: ""; width: 1.1vh; height: 1.1vh; border-radius: 50%; background: var(--red); box-shadow: 0 0 1.2vh var(--red); animation: pulse 2s ease-in-out infinite; }
  #liveTitle { flex: 1; min-width: 0; font-size: 2.3vh; font-weight: 500; color: var(--soft); line-height: 1.25;
               display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .bn button { flex: none; display: flex; align-items: center; justify-content: center; gap: .5vw; min-height: 6.4vh; min-width: 6.4vh;
               padding: 0 1.3vw; border-radius: 3.2vh; border: 1px solid rgba(255,255,255,.18);
               background: rgba(255,255,255,.12); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
               color: #fff; font: 600 2.2vh/1 Inter, Roboto, system-ui, sans-serif; cursor: pointer;
               transition: background .4s ease, color .4s ease, transform .12s ease; }
  .bn button:active { transform: scale(.94); }
  .bn button .ic { font-size: 2.7vh; }
  #liveSound.on { background: rgba(255,255,255,.92); color: #0b0e13; border-color: transparent; }
  #liveClose { display: none; }
  .live.ducked #liveSound .tx::after { content: " · quiet"; font-weight: 500; opacity: .7; }
  .live::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
                 box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); transition: box-shadow 1s ease; }
  .live.breaking { animation: glow 4s ease-in-out infinite; }
  .live.breaking.seen, .live.breaking.seen .bn b::before { animation: none; }
  .live.breaking::after { box-shadow: inset 0 0 0 .22vh rgba(255,90,95,.75); }
  .live.breaking .bn { padding-top: 6vh; flex-wrap: wrap; row-gap: .5vh;
                       background: linear-gradient(180deg, transparent, rgba(90,6,12,.55) 45%, rgba(120,10,18,.9)); }
  .live.breaking .bn b { width: 100%; color: #fff; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; font-size: 1.9vh; }
  .live.breaking .bn b::before { background: #fff; box-shadow: 0 0 1.4vh #fff; }
  .live.breaking #liveTitle { color: #fff; font-weight: 600; font-size: 2.6vh; }
  .live.breaking .bn .tx { display: none; }
  .live.breaking .bn button { padding: 0; width: 7vh; }
  .live.breaking #liveClose { display: flex; }
  .live .muted { position: absolute; left: 1.4vw; top: 1.6vh; background: rgba(0,0,0,.5); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
                 color: #fff; font-size: 2vh; font-weight: 500; padding: .7vh 1.1vw; border-radius: 1.2vh; animation: fadein .8s ease both; }
  @keyframes pulse { 50% { opacity: .35; } }
  @keyframes glow { 50% { box-shadow: 0 0 4vh rgba(255,77,85,.28), 0 2vh 6vh rgba(0,0,0,.28); } }

  /* Status line */
  .status { grid-area: status; display: flex; justify-content: flex-end; align-items: center; gap: .6vw; font-size: 1.75vh; color: var(--muted); opacity: .8; transition: color .8s; }
  .status::before { content: ""; width: .9vh; height: .9vh; border-radius: 50%; background: var(--ok); box-shadow: 0 0 1vh var(--ok); }
  .status:not(.stale) { opacity: 0; }
  .status.stale { color: var(--warn); opacity: 1; font-weight: 600; }
  .status.stale::before { background: var(--warn); box-shadow: 0 0 1vh var(--warn); }

  /* Night dimming: a black veil, since a web page can't change the backlight. */
  #veil { position: fixed; inset: 0; z-index: 5; background: #000; opacity: 0; pointer-events: none; transition: opacity 60s linear; }
  body.night #veil { opacity: .62; }
  /* Nobody around: screen fades to black; it comes back when the camera sees movement or someone taps. */
  #sleep { position: fixed; inset: 0; z-index: 6; background: #000; opacity: 0; pointer-events: none; transition: opacity .6s ease-out; }
  body.asleep #sleep { opacity: 1; pointer-events: auto; transition: opacity 5s ease-in; }

  /* Kitchen timers */
  .clock { cursor: pointer; }
  #timerBtn { margin-left: auto; align-self: center; display: inline-flex; align-items: center; gap: .5vw; padding: .9vh 1.3vw;
              border-radius: 999px; border: 1px solid var(--edge-hi); background: rgba(255,255,255,.07); color: var(--soft);
              font: 600 2.3vh Inter, system-ui, sans-serif; -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); }
  .timers { display: flex; flex-wrap: wrap; gap: 1vh .8vw; margin-top: 1.6vh; }
  .timers:empty { display: none; }
  .tm { display: inline-flex; align-items: center; gap: .8vw; padding: .8vh .6vw .8vh 1.2vw; border-radius: 999px;
        background: rgba(255,255,255,.09); border: 1px solid var(--edge-hi); animation: rise .5s ease both;
        -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); }
  .tm .left { font-size: 3.6vh; font-weight: 600; font-variant-numeric: tabular-nums; }
  .tm .lbl { font-size: 2vh; color: var(--muted); font-weight: 500; }
  .tm button { width: 4.4vh; height: 4.4vh; border-radius: 50%; border: 0; background: rgba(255,255,255,.1); color: var(--soft); font-size: 2.2vh; }
  .tm.soon .left { color: var(--accent); }
  /* With timers running the clock gets a little smaller, so the layout doesn't move */
  .clock.has-timers #time { font-size: 13.5vh; }
  .clock.has-timers .sub { margin-top: 1vh; }
  .timers.many .lbl { display: none; }
  .tm.done { background: rgba(229,72,77,.3); border-color: rgba(255,140,140,.5); }

  /* Timer picker and "done" card: above the night veil and the sleep screen */
  .sheet { position: fixed; inset: 0; z-index: 8; display: grid; place-items: center; background: rgba(4,6,10,.55);
           opacity: 0; pointer-events: none; transition: opacity .35s ease; }
  .sheet.on { opacity: 1; pointer-events: auto; }
  .sheet .card { width: min(78vw, 120vh); padding: 4vh 3vw; border-radius: 5vh; position: relative;
                 background: linear-gradient(160deg, rgba(40,46,58,.82), rgba(18,22,30,.9)); border: 1px solid var(--edge-hi);
                 -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: 0 4vh 12vh rgba(0,0,0,.5);
                 transform: translateY(2vh) scale(.98); transition: transform .35s ease; }
  .sheet.on .card { transform: none; }
  .sheet h2 { font-size: 4vh; font-weight: 600; margin-bottom: 3vh; }
  .sheet .x { position: absolute; top: 2.6vh; right: 2vw; width: 7vh; height: 7vh; border-radius: 50%; border: 0;
              background: rgba(255,255,255,.08); color: var(--soft); font-size: 3vh; }
  .presets { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2vh 1.4vw; }
  .presets button, .custom button { height: 12vh; border-radius: 3vh; border: 1px solid var(--edge-hi); background: rgba(255,255,255,.07);
              color: var(--text); font: 600 4.4vh Inter, system-ui, sans-serif; }
  .presets button small { display: block; font-size: 2vh; font-weight: 500; color: var(--muted); margin-top: .2vh; }
  .presets button:active, .custom button:active, .tm button:active { background: rgba(255,255,255,.2); }
  .custom { display: flex; align-items: center; gap: 1.4vw; margin-top: 3vh; padding-top: 3vh; border-top: 1px solid var(--edge); }
  .custom button { height: 10vh; width: 10vh; font-size: 3.4vh; }
  .custom .val { flex: 1; text-align: center; font-size: 6vh; font-weight: 600; font-variant-numeric: tabular-nums; }
  .custom .val small { font-size: 2.6vh; color: var(--muted); font-weight: 500; margin-left: .4vw; }
  .custom .go { width: auto; padding: 0 3vw; background: var(--accent); color: #1a140a; border: 0; }
  #ring .card { text-align: center; padding: 7vh 3vw; background: linear-gradient(160deg, rgba(150,40,46,.85), rgba(70,16,24,.92)); }
  #ring .big { font-size: 13vh; line-height: 1; }
  #ring .what { font-size: 7vh; font-weight: 700; margin-top: 2vh; }
  #ring .hint { font-size: 3vh; color: rgba(255,255,255,.75); margin-top: 2vh; }
  #ring.on .big { animation: shake 1.2s ease-in-out infinite; }
  @keyframes shake { 0%,100% { transform: rotate(0); } 15% { transform: rotate(-12deg); } 30% { transform: rotate(10deg); } 45% { transform: rotate(-6deg); } 60% { transform: rotate(0); } }

  /* Morning briefing: "While you were asleep" */
  #brief { position: fixed; inset: 0; z-index: 7; display: grid; place-items: center; background: rgba(4,6,10,.45);
           opacity: 0; pointer-events: none; transition: opacity 1.2s ease; }
  #brief.on { opacity: 1; pointer-events: auto; }
  #brief .card { width: min(88vw, 150vh); max-height: 94vh; overflow: hidden; display: flex; flex-direction: column; padding: 4vh 3vw 3vh; border-radius: 5vh;
                 background: linear-gradient(160deg, rgba(44,50,64,.8), rgba(16,20,28,.88)); border: 1px solid var(--edge-hi);
                 -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: 0 4vh 12vh rgba(0,0,0,.5);
                 transform: translateY(2vh); transition: transform 1.2s ease; }
  #brief.on .card { transform: none; }
  #brief .hd { display: flex; align-items: baseline; gap: 1.4vw; margin-bottom: 2.4vh; }
  #brief h2 { font-size: 5.2vh; font-weight: 700; letter-spacing: -.01em; }
  #brief .since { font-size: 2.6vh; color: var(--muted); font-weight: 500; }
  #brief ol { list-style: none; padding: 0; display: grid; gap: 2.2vh; min-height: 0; overflow: hidden; }
  #brief li { display: grid; grid-template-columns: 4.6vh 1fr; column-gap: 1.2vw; animation: rise .7s ease both; }
  #brief li:nth-child(2) { animation-delay: .12s; } #brief li:nth-child(3) { animation-delay: .24s; }
  #brief li:nth-child(4) { animation-delay: .36s; } #brief li:nth-child(5) { animation-delay: .48s; } #brief li:nth-child(6) { animation-delay: .6s; }
  #brief .n { font-size: 3vh; font-weight: 700; color: var(--accent); line-height: 1.25; }
  #brief .t { font-size: 3.3vh; font-weight: 600; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #brief .m { grid-column: 2; font-size: 2.2vh; color: var(--muted); margin-top: .5vh; display: flex; align-items: center; gap: .8vw; }
  #brief .m .b { background: var(--red, #e5484d); color: #fff; font-weight: 700; font-size: 1.8vh; letter-spacing: .06em; padding: .3vh .7vw; border-radius: .8vh; text-transform: uppercase; }
  #brief .acts { display: flex; gap: 1.2vw; justify-content: flex-end; margin-top: 3vh; }
  #brief .acts button { height: 7.5vh; padding: 0 2.4vw; border-radius: 999px; border: 1px solid var(--edge-hi); background: rgba(255,255,255,.08);
                        color: var(--text); font: 600 2.8vh Inter, system-ui, sans-serif; }
  #brief .acts .done { background: var(--text); color: #0b0e13; border-color: var(--text); }
</style>
</head>
<body>
<div class="aura"><i></i><i></i><i></i></div>
<main>
  <section class="clock">
    <div id="time">--:--</div>
    <div class="sub"><div id="date"></div><div id="town"></div><button id="timerBtn">⏱ Timer</button></div>
    <div class="timers" id="timers"></div>
  </section>

  <section class="panel now">
    <div class="cur">
      <div id="nowIcon">·</div>
      <div id="nowTemp">--</div>
      <div id="nowCond">Loading weather…</div>
    </div>
    <div class="air" id="air"></div>
    <div class="days" id="days"></div>
  </section>

  <section class="panel news" id="news"><div class="empty">Loading news…</div></section>

  <section class="panel live" id="live">
    <div id="livePlayer"></div>
    <div class="bn"><b>LIVE</b><span id="liveTitle"></span>
      <button id="liveSound" aria-label="Sound"><span class="ic">🔇</span><span class="tx">Sound</span></button>
      <button id="liveClose" aria-label="Stop"><span class="ic">✕</span><span class="tx">Stop</span></button>
    </div>
  </section>

  <div class="status" id="status"></div>
</main>
<div id="veil"></div>
<div id="sleep"></div>
<div id="brief"><div class="card">
  <div class="hd"><h2>While you were asleep</h2><div class="since" id="briefSince"></div></div>
  <ol id="briefList"></ol>
  <div class="acts"><button id="briefLive">🔊 Sound</button><button class="done" id="briefDone">Done</button></div>
</div></div>
<div class="sheet" id="picker"><div class="card">
  <h2>Set a timer</h2><button class="x" data-close>✕</button>
  <div class="presets" id="presets"></div>
  <div class="custom"><button data-step="-5">−5</button><button data-step="-1">−1</button>
    <div class="val"><span id="customVal">12</span><small>min</small></div>
    <button data-step="1">+1</button><button data-step="5">+5</button><button class="go" id="customGo">Start</button></div>
</div></div>
<div class="sheet" id="ring"><div class="card"><div class="big">⏰</div><div class="what" id="ringWhat">Timer done</div><div class="hint">Tap anywhere to stop</div></div></div>

<script>
"use strict";
const WEATHER_EVERY = 15 * 60e3;   // weather refresh
const NEWS_EVERY = 2 * 60e3;       // news.json refresh (the GitHub job updates it every ~10 min)

let CFG = null;
const state = { weather: null, weatherAt: 0, news: null, newsAt: 0, weatherErr: false, newsErr: false };

// --- storage helpers: last good data survives reloads and internet drops ---
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

// --- WMO weather codes -> words + emoji (day, night) ---
const WMO = {
  0: ["Clear", "☀️", "🌙"], 1: ["Mostly clear", "🌤️", "🌙"], 2: ["Partly cloudy", "⛅", "☁️"], 3: ["Cloudy", "☁️", "☁️"],
  45: ["Fog", "🌫️", "🌫️"], 48: ["Freezing fog", "🌫️", "🌫️"],
  51: ["Light drizzle", "🌦️", "🌧️"], 53: ["Drizzle", "🌦️", "🌧️"], 55: ["Heavy drizzle", "🌧️", "🌧️"],
  56: ["Freezing drizzle", "🌧️", "🌧️"], 57: ["Freezing drizzle", "🌧️", "🌧️"],
  61: ["Light rain", "🌦️", "🌧️"], 63: ["Rain", "🌧️", "🌧️"], 65: ["Heavy rain", "🌧️", "🌧️"],
  66: ["Freezing rain", "🌧️", "🌧️"], 67: ["Freezing rain", "🌧️", "🌧️"],
  71: ["Light snow", "🌨️", "🌨️"], 73: ["Snow", "🌨️", "🌨️"], 75: ["Heavy snow", "❄️", "❄️"], 77: ["Snow grains", "🌨️", "🌨️"],
  80: ["Showers", "🌦️", "🌧️"], 81: ["Showers", "🌧️", "🌧️"], 82: ["Heavy showers", "⛈️", "⛈️"],
  85: ["Snow showers", "🌨️", "🌨️"], 86: ["Snow showers", "🌨️", "🌨️"],
  95: ["Thunderstorm", "⛈️", "⛈️"], 96: ["Thunderstorm, hail", "⛈️", "⛈️"], 99: ["Thunderstorm, hail", "⛈️", "⛈️"],
};
const wmo = (c, day = true) => { const w = WMO[c] || ["–", "·", "·"]; return { text: w[0], icon: day ? w[1] : w[2] }; };

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const deg = t => Math.round(t) + "°";

function fmtTime(d, withAmPm = true) {
  const h = d.getHours(), m = pad(d.getMinutes());
  if (CFG.clock24) return `${pad(h)}:${m}`;
  const h12 = h % 12 || 12;
  return withAmPm ? `${h12}:${m} ${h < 12 ? "am" : "pm"}` : `${h12}:${m}`;
}
const toMin = hhmm => { const [h, m] = hhmm.split(":").map(Number); return h * 60 + m; };
function ago(ts) {
  const m = Math.round((Date.now() - ts) / 60e3);
  if (m < 1) return "just now";
  if (m < 60) return `${m} min ago`;
  const h = Math.round(m / 60);
  return h < 24 ? `${h} h ago` : `${Math.round(h / 24)} d ago`;
}

// --- clock + night dimming ---
function tick() {
  const now = new Date();
  const h = now.getHours();
  const t = CFG.clock24 ? fmtTime(now) : `${fmtTime(now, false)}<span class="ampm">${h < 12 ? "AM" : "PM"}</span>`;
  if ($("time").innerHTML !== t) {
    const el = $("time"), first = el.textContent === "--:--";
    if (!first) { el.classList.add("tick"); void el.offsetWidth; }
    el.innerHTML = t; el.classList.remove("tick");
  }
  $("date").textContent = now.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" });
  const mins = h * 60 + now.getMinutes(), s = toMin(CFG.nightStart), e = toMin(CFG.nightEnd);
  const night = s > e ? (mins >= s || mins < e) : (mins >= s && mins < e);
  // Sound someone turned on by hand goes off when night starts (breaking news still follows its own rule).
  if (night && !document.body.classList.contains("night") && live.manual) { live.manual = false; store.set("manualSoundUntil", 0); checkBreaking(); }
  document.body.classList.toggle("night", night);
  renderStatus();
}

// --- weather ---
async function loadWeather() {
  const p = new URLSearchParams({
    latitude: CFG.latitude, longitude: CFG.longitude, timezone: "auto", forecast_days: 3,
    temperature_unit: CFG.temperatureUnit, wind_speed_unit: CFG.windUnit,
    current: "temperature_2m,apparent_temperature,weather_code,is_day",
    daily: "weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max",
  });
  try {
    const r = await fetch("https://api.open-meteo.com/v1/forecast?" + p, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    state.weather = await r.json();
    state.weatherAt = Date.now();
    state.weatherErr = false;
    store.set("weather", { data: state.weather, at: state.weatherAt });
  } catch (e) {
    state.weatherErr = true;
  }
  renderWeather();
  loadAir();
}

// --- air quality, dust and UV (Open-Meteo, free) ---
async function loadAir() {
  const p = new URLSearchParams({ latitude: CFG.latitude, longitude: CFG.longitude, timezone: "auto",
    forecast_days: 1, current: "us_aqi,dust,uv_index", hourly: "uv_index" });
  try {
    const r = await fetch("https://air-quality-api.open-meteo.com/v1/air-quality?" + p, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    state.air = await r.json();
    store.set("air", { data: state.air, at: Date.now() });
  } catch (e) { /* keep the last one */ }
  renderAir();
}
function renderAir() {
  const a = state.air;
  if (!a || !a.current) { $("air").innerHTML = ""; return; }
  const c = a.current, out = [];
  const q = c.us_aqi;
  if (q != null) {
    const [txt, col] = q <= 50 ? ["Air good", "#4cc38a"] : q <= 100 ? ["Air moderate", "#e8c547"]
      : q <= 150 ? ["Air poor for sensitive people", "#f5a524"] : q <= 200 ? ["Air unhealthy", "#e5484d"] : ["Air very unhealthy", "#b84dff"];
    out.push(`<span><i class="dot" style="--c:${col}"></i>${txt}</span>`);
  }
  if (c.dust >= 300) out.push("<span>🌪️ Sandstorm</span>");
  else if (c.dust >= 100) out.push("<span>🌫️ Dusty</span>");
  // UV: show the high-UV hours still ahead today (UV 6+ is "high").
  const h = a.hourly || {}, now = new Date(), hh = pad(now.getHours());
  const today = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
  const high = (h.time || []).map((t, i) => [t, h.uv_index[i]]).filter(([t, u]) => t.startsWith(today) && u >= 6);
  if (high.length && high[high.length - 1][0].slice(11, 13) >= hh) {
    const peak = Math.max(...high.map(x => x[1]));
    const word = peak >= 11 ? "extreme" : peak >= 8 ? "very high" : "high";
    const from = high[0][0].slice(11, 16), to = pad(+high[high.length - 1][0].slice(11, 13) + 1) + ":00";
    out.push(`<span>☀️ UV ${word} ${from}–${to}</span>`);
  }
  $("air").innerHTML = out.join("");
}

function renderWeather() {
  const w = state.weather;
  if (!w) return;
  const c = w.current, d = w.daily;
  const cur = wmo(c.weather_code, c.is_day);
  const k = c.weather_code;
  document.body.dataset.mood = !c.is_day ? "night" : k >= 95 ? "storm" : (k >= 51 && k <= 86) ? "rain" : (k === 45 || k === 48) ? "fog" : k >= 2 ? "cloud" : "sun";
  $("nowIcon").textContent = cur.icon;
  $("nowTemp").innerHTML = `${Math.round(c.temperature_2m)}<small>°</small>`;
  $("nowCond").innerHTML = `${cur.text}<br><span>Feels like ${deg(c.apparent_temperature)}</span>`;

  // Today + the next 2 days.
  const n = new Date(), todayKey = `${n.getFullYear()}-${pad(n.getMonth() + 1)}-${pad(n.getDate())}`;
  let first = d.time.indexOf(todayKey);
  if (first < 0) first = 0;
  let html = "";
  for (let i = first; i < first + 3 && i < d.time.length; i++) {
    const name = i === first ? "Today" : new Date(d.time[i] + "T12:00").toLocaleDateString(undefined, { weekday: "short" });
    const rain = d.precipitation_probability_max[i] ?? 0;
    html += `<div class="day${i === first ? " today" : ""}">
      <div class="i">${wmo(d.weather_code[i]).icon}</div>
      <div class="n">${name}${rain >= 20 ? `<span class="p">💧${rain}%</span>` : ""}</div>
      <div class="hl">${deg(d.temperature_2m_max[i])} <span>${deg(d.temperature_2m_min[i])}</span></div></div>`;
  }
  $("days").innerHTML = html;
}

// --- live news feed ---
// Always playing on mute. When news.json flags breaking news, it switches to a channel in the
// story's language (English / French / Italian) and the sound comes on at CFG.liveVolume for
// CFG.liveMinutes, once per story. ✕ mutes it early; 🔇/🔊 turns sound on or off by hand.
// While the sound is on, the microphone listens for people talking and lowers the volume
// (CFG.duckVolume) until the room is quiet again. Nothing is recorded or sent anywhere.
let live = { player: null, ready: false, lang: null, breakingId: null, manual: false, soundOn: false };
function isNight() {
  const d = new Date(), m = d.getHours() * 60 + d.getMinutes(), s = toMin(CFG.nightStart), e = toMin(CFG.nightEnd);
  return s > e ? (m >= s || m < e) : (m >= s && m < e);
}
function loadYT() {
  return new Promise(res => {
    if (window.YT && YT.Player) return res();
    window.onYouTubeIframeAPIReady = res;
    const t = document.createElement("script"); t.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(t);
  });
}
function channels() {
  const l = CFG.live || {};
  return l.channelId ? { en: l } : l;   // old single-channel config still works
}
async function startLive(lang) {
  const all = channels(), ch = all[lang] || all.en;
  if (!ch || !ch.channelId) return;
  if (live.lang === lang) return;   // already showing (or loading) this channel
  if (live.player) { try { live.player.destroy(); } catch {} }
  live.player = null; live.ready = false; live.lang = lang;
  const f = document.createElement("iframe");
  f.allow = "autoplay; encrypted-media";
  f.src = `https://www.youtube.com/embed/live_stream?channel=${encodeURIComponent(ch.channelId)}&autoplay=1&mute=1&controls=0&playsinline=1&rel=0&enablejsapi=1&origin=${encodeURIComponent(location.origin)}`;
  const box = $("livePlayer"); box.innerHTML = ""; box.appendChild(f);
  try { await loadYT(); } catch { return; }
  const p = new YT.Player(f, {
    events: {
      onReady: () => { if (live.player !== p) return; live.ready = true; p.mute(); p.playVideo(); checkBreaking(); },
      onStateChange: e => { if (e.data === YT.PlayerState.ENDED) setTimeout(() => p.playVideo(), 3000); },
    },
  });
  live.player = p;
}
// Keep it running: restart within a minute if it gets paused or stalls.
setInterval(() => {
  const p = live.player; if (!p || !live.ready) return;
  const st = p.getPlayerState(); if (st !== YT.PlayerState.PLAYING && st !== YT.PlayerState.BUFFERING) p.playVideo();
}, 60e3);

function breakingNow() {
  const n = state.news;
  if (CFG.forceBreaking && n && n.items && n.items[0]) return { ...n.items[0], id: "test-" + new Date().toISOString().slice(0, 13) };
  return (n && n.breaking) || null;
}
function checkBreaking() {
  if (!CFG) return;
  const b = breakingNow();
  const seen = store.get("liveSeen") || {};            // story id -> when its sound first came on, or "closed"
  let on = false;
  if (b && seen[b.id] !== "closed") {
    if (!seen[b.id]) {
      seen[b.id] = Date.now();
      const keys = Object.keys(seen); if (keys.length > 50) delete seen[keys[0]];
      store.set("liveSeen", seen);
    }
    on = Date.now() - seen[b.id] <= (CFG.liveMinutes || 15) * 60e3;
  }
  const lang = on && channels()[b.lang] ? b.lang : "en";
  startLive(lang);
  const ch = channels()[lang] || {};
  $("live").classList.toggle("breaking", on);
  $("live").querySelector("b").textContent = on ? "Breaking" : "Live";
  $("liveTitle").textContent = on ? `${b.source}: ${b.title}` : ch.name || "";
  if (on && !live.breakingId) { presence.wake(); $("live").classList.remove("seen"); clearTimeout(live.seenT); live.seenT = setTimeout(() => $("live").classList.add("seen"), 90e3); }
  const bt = on ? b.title : null;
  if (bt !== live.breakingTitle) { live.breakingTitle = bt; renderNews(); }
  live.breakingId = on ? b.id : null;
  setSound(live.manual || (on && !(isNight() && !CFG.liveSoundAtNight)), on && isNight() && !live.manual);
}
// Morning briefing plays a little quieter than breaking news.
// Sound turned on by hand plays at manualVolume (full by default: the tablet's speakers are quiet).
const liveVol = () => live.morning ? (CFG.morningVolume ?? 40) : live.manual ? (CFG.manualVolume ?? 100) : (CFG.liveVolume ?? 60);
function setSound(want, nightQuiet) {
  live.soundOn = want;
  note(nightQuiet ? "Sound off at night" : "");
  showSound(want);
  want ? listen.start() : listen.stop();
  const p = live.player;
  if (!p || !live.ready) return;
  if (!want) { p.mute(); p.playVideo(); return; }
  p.unMute(); p.setVolume(listen.talking ? (CFG.duckVolume ?? 20) : liveVol()); p.playVideo();
  // If the browser won't play with sound, keep the picture going on mute instead of a paused video.
  setTimeout(() => {
    if (live.player !== p || !p.getPlayerState) return;
    if (p.getPlayerState() === YT.PlayerState.PAUSED) { p.mute(); p.playVideo(); showSound(false); note("Tap Sound to hear it"); }
  }, 8000);
}
function showSound(on) {
  const b = $("liveSound"); b.classList.toggle("on", on);
  b.querySelector(".ic").textContent = on ? "🔊" : "🔇";
  b.querySelector(".tx").textContent = on ? "Sound on" : "Sound";
}
function note(text) {
  let el = $("live").querySelector(".muted");
  if (!text) return el && el.remove();
  if (!el) { el = document.createElement("div"); el.className = "muted"; $("live").appendChild(el); }
  el.textContent = text;
}
document.addEventListener("click", e => {
  const btn = e.target.closest && e.target.closest("button"); if (!btn) return;
  if (btn.id === "liveSound") { live.morning = false; live.manual = !$("liveSound").classList.contains("on");
    store.set("manualSoundUntil", live.manual ? Date.now() + 3 * 3600e3 : 0);   // survives a page reload (remote update)
    if (!live.manual && live.breakingId) markClosed(); checkBreaking(); return; }
  if (btn.id !== "liveClose" || !live.breakingId) return;
  markClosed(); checkBreaking();
});
function markClosed() {
  const seen = store.get("liveSeen") || {}; seen[live.breakingId] = "closed"; store.set("liveSeen", seen);
}

// --- "people are talking" detector (only runs while the sound is on) ---
// Measures how loud the voice frequencies are compared with the room's usual level.
// Echo cancellation removes most of the tablet's own sound from what the mic hears.
const listen = {
  stream: null, ctx: null, timer: null, talking: false, floor: null, loudSince: 0, quietSince: 0,
  async start() {
    if (!CFG.duckWhenTalking || this.stream || this.starting) return;
    this.starting = true;
    try {
      this.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: false, autoGainControl: false } });
    } catch { this.starting = false; return; }   // no permission: just don't duck
    this.starting = false;
    if (!live.soundOn) return this.stop();
    this.ctx = new AudioContext();
    const src = this.ctx.createMediaStreamSource(this.stream), an = this.ctx.createAnalyser();
    an.fftSize = 2048; src.connect(an);
    const bins = new Float32Array(an.frequencyBinCount), hz = this.ctx.sampleRate / an.fftSize;
    const lo = Math.round(300 / hz), hi = Math.round(3400 / hz);
    this.floor = null;
    this.timer = setInterval(() => {
      an.getFloatFrequencyData(bins);
      let e = 0; for (let i = lo; i < hi; i++) e += 10 ** (bins[i] / 10);
      const db = 10 * Math.log10(e / (hi - lo) + 1e-12);
      // Room level: follows quiet moments quickly, loud moments slowly.
      this.floor = this.floor == null ? db : (db < this.floor ? this.floor * 0.9 + db * 0.1 : this.floor * 0.999 + db * 0.001);
      // Talking = clearly above the room's usual level AND above its normal background peaks.
      const now = Date.now(), loud = db > Math.max(this.floor + (CFG.duckSensitivityDb ?? 12), CFG.duckMinDb ?? -72);
      if (loud) { this.quietSince = 0; this.loudSince ||= now; } else { this.loudSince = 0; this.quietSince ||= now; }
      if (!this.talking && this.loudSince && now - this.loudSince > 500) this.set(true);
      if (this.talking && this.quietSince && now - this.quietSince > 3000) this.set(false);
    }, 100);
  },
  set(talking) {
    this.talking = talking;
    const p = live.player;
    if (p && live.ready && live.soundOn) p.setVolume(talking ? (CFG.duckVolume ?? 20) : liveVol());
    $("live").classList.toggle("ducked", talking);
  },
  stop() {
    clearInterval(this.timer); this.timer = null;
    if (this.stream) this.stream.getTracks().forEach(t => t.stop());
    if (this.ctx) this.ctx.close().catch(() => {});
    this.stream = this.ctx = null; this.talking = false;
    $("live").classList.remove("ducked");
  },
};

// --- kitchen timers ---
// Saved in the browser, so they keep going through the page's automatic reloads.
// A finished timer chimes (soft, repeating for up to 3 minutes) and shows a big card until someone taps.
const timers = {
  list: [], custom: 12, ctx: null, ringT: null, ringStop: 0,
  load() { this.list = (store.get("timers") || []).filter(t => Date.now() - t.end < 15 * 60e3); this.render(); },
  save() { store.set("timers", this.list); },
  add(mins) {
    if (this.list.length >= 3) this.list.shift();
    this.list.push({ id: Date.now(), mins, end: Date.now() + mins * 60e3 });
    this.save(); this.close(); this.render(); this.audio();
  },
  remove(id) { this.list = this.list.filter(t => t.id !== id); this.save(); this.render(); },
  label: m => m >= 60 && m % 60 === 0 ? `${m / 60} h` : m > 60 ? `${Math.floor(m / 60)} h ${m % 60} min` : `${m} min`,
  left(ms) { const s = Math.max(0, Math.ceil(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60;
             return h ? `${h}:${pad(m)}:${pad(s % 60)}` : `${m}:${pad(s % 60)}`; },
  render() {
    const now = Date.now();
    document.querySelector(".clock").classList.toggle("has-timers", this.list.length > 0);
    $("timers").classList.toggle("many", this.list.length > 2);
    $("timers").innerHTML = this.list.map(t => {
      const ms = t.end - now, done = ms <= 0;
      return `<div class="tm${done ? " done" : ms < 60e3 ? " soon" : ""}" data-id="${t.id}"><span class="left">${done ? "Done" : this.left(ms)}</span>` +
             `<span class="lbl">${this.label(t.mins)}</span><button data-cancel="${t.id}" aria-label="Cancel">✕</button></div>`;
    }).join("");
  },
  tick() {
    if (!this.list.length) return;
    const due = this.list.filter(t => t.end <= Date.now() && !t.rung);
    if (due.length) { due.forEach(t => t.rung = true); this.save(); this.ring(due.map(t => this.label(t.mins))); }
    this.render();
  },
  audio() {   // created on a tap, so the browser lets it make sound later
    try { this.ctx = this.ctx || new (window.AudioContext || window.webkitAudioContext)(); this.ctx.resume(); } catch {}
  },
  chime() {
    const c = this.ctx; if (!c) return;
    [[880, 0], [1175, .22], [1568, .44]].forEach(([f, t]) => {
      const o = c.createOscillator(), g = c.createGain(), at = c.currentTime + t;
      o.type = "sine"; o.frequency.value = f; o.connect(g); g.connect(c.destination);
      g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(.35, at + .02); g.gain.exponentialRampToValueAtTime(.001, at + 1.1);
      o.start(at); o.stop(at + 1.2);
    });
  },
  ring(labels) {
    presence.wake();
    $("ringWhat").textContent = labels.length > 1 ? labels.join(" + ") + " done" : labels[0] + " timer done";
    $("ring").classList.add("on");
    this.audio(); this.ringStop = Date.now() + 3 * 60e3;
    clearInterval(this.ringT); this.chime();
    this.ringT = setInterval(() => Date.now() > this.ringStop ? clearInterval(this.ringT) : this.chime(), 2500);
  },
  hush() {
    clearInterval(this.ringT); $("ring").classList.remove("on");
    this.list = this.list.filter(t => !t.rung); this.save(); this.render();
  },
  open() {
    this.audio();
    $("presets").innerHTML = [1, 3, 5, 8, 10, 15, 20, 30, 45, 60].map(m =>
      `<button data-min="${m}">${m >= 60 ? m / 60 : m}<small>${m >= 60 ? "hour" : "min"}</small></button>`).join("");
    $("customVal").textContent = this.custom;
    $("picker").classList.add("on");
  },
  close() { $("picker").classList.remove("on"); },
  init() {
    this.load();
    $("timerBtn").addEventListener("click", e => { e.stopPropagation(); this.open(); });
    document.querySelector(".clock").addEventListener("click", e => { if (!e.target.closest("[data-cancel]")) this.open(); });
    $("timers").addEventListener("click", e => {
      const b = e.target.closest("[data-cancel]"); if (!b) return;
      e.stopPropagation(); this.remove(+b.dataset.cancel);
    });
    $("picker").addEventListener("click", e => {
      const b = e.target.closest("button");
      if (e.target === $("picker") || (b && b.hasAttribute("data-close"))) return this.close();
      if (!b) return;
      if (b.dataset.min) return this.add(+b.dataset.min);
      if (b.dataset.step) { this.custom = Math.min(600, Math.max(1, this.custom + +b.dataset.step)); $("customVal").textContent = this.custom; }
      if (b.id === "customGo") this.add(this.custom);
    });
    $("ring").addEventListener("click", () => this.hush());
    setInterval(() => this.tick(), 1000);
  },
};

// --- morning briefing ---
// The first time someone walks in (movement after briefingEmptyMinutes with nobody there) in the morning (briefingFrom–briefingUntil),
// it shows the top stories since last night for briefingMinutes, once a day. Tap Done to close it early.
const escHTML = s => String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
const briefing = {
  on: false, hideT: null,
  today() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; },
  maybe(emptyFor = 0) {
    if (emptyFor < (CFG.briefingEmptyMinutes ?? 5) * 60e3) return;   // only when someone walks into an empty kitchen
    if (this.on || !CFG || CFG.briefing === false || store.get("briefed") === this.today()) return;
    const m = new Date().getHours() * 60 + new Date().getMinutes();
    if (m < toMin(CFG.briefingFrom || CFG.nightEnd || "06:30") || m >= toMin(CFG.briefingUntil || "11:00")) return;
    const o = state.news && state.news.overnight;
    if (!o || !o.items || !o.items.length || Date.now() - Date.parse(o.since) > 16 * 3600e3) return;
    store.set("briefed", this.today());
    this.show(o);
  },
  show(o) {
    const since = new Date(o.since), n = Math.min(5, o.items.length);
    $("briefSince").textContent = `Since ${fmtTime(since)} · ${n} ${n === 1 ? "story" : "stories"}`;
    $("briefList").innerHTML = o.items.slice(0, 5).map((it, i) => {
      const srcs = it.sources.length > 2 ? `${it.sources.slice(0, 2).join(", ")} +${it.sources.length - 2}` : it.sources.join(", ");
      return `<li><div class="n">${i + 1}</div><div class="t">${escHTML(it.title)}</div>
        <div class="m">${it.breaking ? '<span class="b">Breaking</span>' : ""}<span>${escHTML(srcs)} · ${fmtTime(new Date(it.time))}</span></div></li>`;
    }).join("");
    this.on = true; $("brief").classList.add("on"); presence.wake();
    // Live news with sound while the card is up (unless someone already turned it on by hand).
    if (CFG.morningSound !== false && !live.manual) { live.morning = true; live.manual = true; checkBreaking(); }
    this.btn();
    clearTimeout(this.hideT); this.hideT = setTimeout(() => this.hide(), (CFG.briefingMinutes || 30) * 60e3);
  },
  hide() {
    this.on = false; clearTimeout(this.hideT); $("brief").classList.remove("on");
    if (live.morning) { live.morning = false; live.manual = false; checkBreaking(); }   // morning sound ends with the card
  },
  btn() { const on = $("liveSound").classList.contains("on"); $("briefLive").textContent = on ? "🔇 Mute" : "🔊 Sound"; },
  init() {
    $("briefDone").addEventListener("click", () => this.hide());
    $("briefLive").addEventListener("click", () => { $("liveSound").click(); this.btn(); });
  },
};

// --- presence: blank the screen when nobody is in the kitchen ---
// The front camera takes a tiny 64x48 grey picture twice a second and compares it with the last one.
// Nothing is saved or sent anywhere. If the camera isn't allowed, the screen simply stays on.
const presence = {
  last: 0, prev: null,
  async start() {
    // Remember the last movement across page reloads, so a reload doesn't hide a walk-in.
    const saved = store.get("lastMove");
    this.last = saved && saved <= Date.now() ? saved : Date.now();
    if (CFG.presence === false) return;
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: 160, height: 120, frameRate: 5 } }); }
    catch { return; }
    const v = document.createElement("video"); v.muted = true; v.playsInline = true; v.srcObject = stream; await v.play().catch(() => {});
    const c = document.createElement("canvas"); c.width = 64; c.height = 48;
    const g = c.getContext("2d", { willReadFrequently: true });
    const minPct = CFG.presenceSensitivity ?? 1.5;   // % of the picture that must change
    const settle = Date.now() + 20e3;                  // the camera adjusts its exposure at first: not a person
    setInterval(() => {
      if (v.readyState < 2) return;
      g.drawImage(v, 0, 0, 64, 48);
      const d = g.getImageData(0, 0, 64, 48).data, cur = new Uint8Array(64 * 48);
      for (let i = 0; i < cur.length; i++) cur[i] = (d[i * 4] + d[i * 4 + 1] * 2 + d[i * 4 + 2]) >> 2;
      if (this.prev) {
        let mean = 0; for (let i = 0; i < cur.length; i++) mean += cur[i] - this.prev[i];
        mean /= cur.length;                            // ignore the whole room getting lighter/darker
        let changed = 0; for (let i = 0; i < cur.length; i++) if (Math.abs(cur[i] - this.prev[i] - mean) > 25) changed++;
        this.pct = changed / cur.length * 100;          // read by Brain's presence log
        if (changed / cur.length * 100 >= minPct && Date.now() > settle) {
          const emptyFor = Date.now() - this.last;     // how long nobody had moved: a walk-in if it's been a while
          this.wake(); briefing.maybe(emptyFor);
        }
      }
      this.prev = cur;
    }, 500);
    setInterval(() => this.check(), 5000);
  },
  wake() {
    this.last = Date.now(); document.body.classList.remove("asleep");
    if (!this.saved || this.last - this.saved > 10e3) { this.saved = this.last; store.set("lastMove", this.last); }
  },
  check() {
    const idle = Date.now() - this.last > (CFG.presenceIdleMinutes ?? 10) * 60e3;
    document.body.classList.toggle("asleep", idle && !live.breakingId && !timers.list.length && !briefing.on);   // breaking news or a running timer keeps the screen on
  },
};
// A tap on the black screen only wakes it up (doesn't press whatever is underneath).
document.addEventListener("pointerdown", () => presence.wake(), true);

// --- news (news.json is written by the GitHub Action next to this page) ---
async function loadNews() {
  try {
    const r = await fetch("news.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    state.news = await r.json();
    state.newsAt = Date.now();
    state.newsErr = false;
    store.set("news", { data: { ...state.news, history: undefined }, at: state.newsAt });
  } catch (e) {
    state.newsErr = true;
  }
  renderNews();
}

function renderNews() {
  const n = state.news;
  if (!n || !n.items || !n.items.length) {
    $("news").innerHTML = `<div class="empty">${state.newsErr ? "News isn't available yet." : "Loading news…"}</div>`;
    return;
  }
  const esc = s => s.replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
  const list = n.items.filter(it => it.title !== live.breakingTitle).slice(0, CFG.headlines);
  const html = list.map(it => `
    <div class="item${it.time && Date.now() - Date.parse(it.time) < 30 * 60e3 ? " fresh" : ""}"><div class="h">${esc(it.title)}</div>
    <div class="m"><b>${esc(it.source)}</b>${it.lang && it.lang !== "en" ? `<i class="lang">${it.lang.toUpperCase()}</i>` : ""}${it.time ? "<span>" + ago(Date.parse(it.time)) + "</span>" : ""}</div></div>`).join("");
  const box = $("news"), sig = list.map(i => i.title).join("|");
  if (box.dataset.sig !== sig) { box.classList.remove("fresh"); void box.offsetWidth; box.classList.add("fresh"); box.dataset.sig = sig; }
  box.innerHTML = html;
  checkBreaking();
}

// --- "last updated" line; turns amber when data is old or the internet is down ---
function renderStatus() {
  if (!CFG) return;
  const parts = [], now = Date.now();
  let stale = false;
  if (state.weatherAt) {
    const old = now - state.weatherAt > WEATHER_EVERY * 2.5;
    stale ||= old || state.weatherErr;
    parts.push(`Weather ${fmtTime(new Date(state.weatherAt))}`);
  }
  if (state.newsAt) {
    const old = now - state.newsAt > NEWS_EVERY * 2.5;
    stale ||= old || state.newsErr;
    parts.push(`News ${fmtTime(new Date(state.newsAt))}`);
  }
  const el = $("status");
  el.textContent = (stale ? "Offline: showing the last news and weather · " : "") + parts.join(" · ");
  el.classList.toggle("stale", stale);
}

async function start() {
  try { CFG = await (await fetch("config.json", { cache: "no-cache" })).json(); store.set("config", CFG); }
  catch { CFG = store.get("config"); }
  if (!CFG) { $("nowCond").textContent = "Can't load settings (config.json)."; return; }
  $("town").textContent = CFG.town;

  // Show the last saved data straight away, then refresh.
  const w = store.get("weather"), n = store.get("news");
  if (w) { state.weather = w.data; state.weatherAt = w.at; renderWeather(); }
  const air = store.get("air"); if (air) { state.air = air.data; renderAir(); }
  if (n) { state.news = n.data; state.newsAt = n.at; renderNews(); }

  tick();
  setInterval(tick, 1000);
  timers.init();
  briefing.init();
  loadWeather(); setInterval(loadWeather, WEATHER_EVERY);
  loadNews(); setInterval(loadNews, NEWS_EVERY);
  // Someone turned the sound on by hand before a reload: keep it on (for up to 3 hours, never at night).
  if ((store.get("manualSoundUntil") || 0) > Date.now() && !isNight()) live.manual = true;
  startLive("en");
  presence.start();
  setInterval(checkBreaking, 30e3);               // turn breaking sound off after liveMinutes
  setInterval(renderNews, 60e3);                  // keep "x min ago" current
  setInterval(() => { if (state.weather) renderWeather(); renderAir(); }, 5 * 60e3); // roll "Today" over at midnight
  // Remote updates: every 15 min, check whether the page or config.json changed on GitHub and reload if so.
  const fingerprint = async () => {
    const [a, b] = await Promise.all(["index.html", "config.json"].map(f => fetch(f + "?t=" + Date.now(), { cache: "no-store" }).then(r => { if (!r.ok) throw 0; return r.text(); })));
    return a.length + ":" + b;
  };
  let known = null;
  fingerprint().then(f => known = f).catch(() => {});
  setInterval(async () => {
    try { const f = await fingerprint(); if (known && f !== known) location.reload(); known = known || f; } catch {}
  }, 15 * 60e3);
  // Also reload once a day at 04:00 to clear any memory build-up.
  setInterval(() => { const d = new Date(); if (d.getHours() === 4 && d.getMinutes() === 0 && navigator.onLine) location.reload(); }, 60e3);
}

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
start();
</script>
