<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1319">
<meta name="mobile-web-app-capable" content="yes">
<title>Kitchen Hub</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<style>
  :root {
    --bg: #0f1319;
    --panel: #171d26;
    --line: #262f3c;
    --text: #f2f4f7;
    --muted: #9aa6b6;
    --accent: #f5be50;
    --rain: #5aa9ff;
    --warn: #ffb347;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text); overflow: hidden; }
  body {
    font-family: Roboto, "Segoe UI", system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
    -webkit-user-select: none; user-select: none; cursor: none;
  }
  main {
    height: 100vh; padding: 2.2vh 2vw 1vh;
    display: grid; gap: 1.8vh 1.6vw;
    grid-template-columns: 0.95fr 1.05fr;
    grid-template-rows: auto auto 1fr auto;
    grid-template-areas: "clock now" "hours hours" "days news" "status status";
  }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 2vh; padding: 1.6vh 1.4vw; min-height: 0; overflow: hidden; }
  .label { color: var(--muted); font-size: 2vh; letter-spacing: .08em; text-transform: uppercase; }

  /* Clock */
  .clock { grid-area: clock; display: flex; flex-direction: column; justify-content: center; padding-left: .6vw; }
  #time { font-size: 21vh; font-weight: 600; line-height: .95; letter-spacing: -.02em; }
  #time .ampm { font-size: 6vh; font-weight: 500; color: var(--muted); margin-left: .6vw; }
  #date { font-size: 5vh; color: var(--muted); margin-top: 1vh; }
  #town { font-size: 2.6vh; color: var(--accent); margin-top: .6vh; letter-spacing: .04em; }

  /* Current weather */
  .now { grid-area: now; display: grid; grid-template-columns: auto 1fr; gap: .4vh 1.4vw; align-items: center; }
  #nowIcon { font-size: 14vh; line-height: 1; grid-row: span 2; }
  #nowTemp { font-size: 13vh; font-weight: 600; line-height: 1; }
  #nowTemp small { font-size: 5vh; color: var(--muted); font-weight: 400; vertical-align: top; }
  #nowCond { font-size: 3.6vh; }
  #nowCond span { color: var(--muted); }
  .facts { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(5, 1fr); gap: 1vw; margin-top: 1vh; border-top: 1px solid var(--line); padding-top: 1.2vh; }
  .facts b { display: block; font-size: 3.4vh; font-weight: 600; margin-top: .2vh; white-space: nowrap; }

  /* 12-hour strip */
  .hours { grid-area: hours; display: grid; grid-template-columns: repeat(12, 1fr); gap: .5vw; padding-top: 1vh; padding-bottom: 1vh; }
  .hour { display: flex; flex-direction: column; align-items: center; gap: .3vh; }
  .hour .t { font-size: 2.2vh; color: var(--muted); }
  .hour .i { font-size: 3.4vh; line-height: 1; }
  .hour .deg { font-size: 3.2vh; font-weight: 600; }
  .hour .bar { width: 62%; height: 3.6vh; background: #1f2732; border-radius: .6vh; display: flex; align-items: flex-end; overflow: hidden; }
  .hour .bar i { display: block; width: 100%; background: var(--rain); border-radius: .6vh .6vh 0 0; }
  .hour .p { font-size: 2.2vh; color: var(--rain); font-weight: 600; }
  .hour.cur .t { color: var(--accent); font-weight: 600; }

  /* 4-day forecast */
  .days { grid-area: days; display: grid; grid-template-columns: repeat(4, 1fr); gap: .8vw; }
  .day { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .6vh; border-right: 1px solid var(--line); }
  .day:last-child { border-right: 0; }
  .day .n { font-size: 3vh; font-weight: 600; }
  .day .i { font-size: 6vh; line-height: 1; }
  .day .hl { font-size: 3.2vh; font-weight: 600; }
  .day .hl span { color: var(--muted); font-weight: 400; }
  .day .p { font-size: 2.3vh; color: var(--rain); }

  /* News */
  .news { grid-area: news; padding-top: 1vh; padding-bottom: 1vh; display: flex; flex-direction: column; justify-content: space-between; }
  .item { padding: .3vh 0; border-bottom: 1px solid var(--line); min-width: 0; }
  .item:last-child { border-bottom: 0; }
  .item .h { font-size: 2.65vh; font-weight: 500; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .m { font-size: 1.85vh; color: var(--muted); margin-top: .2vh; }
  .item .m b { color: var(--accent); font-weight: 600; }
  .empty { color: var(--muted); font-size: 2.6vh; margin: auto; text-align: center; }

  .status { grid-area: status; font-size: 1.8vh; color: var(--muted); text-align: right; }
  .status.stale { color: var(--warn); }

  /* Night dimming: a black veil, since a web page can't change the backlight. */
  #veil { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity 60s linear; }
  body.night #veil { opacity: .62; }
</style>
</head>
<body>
<main>
  <section class="clock">
    <div id="time">--:--</div>
    <div id="date"></div>
    <div id="town"></div>
  </section>

  <section class="panel now">
    <div id="nowIcon">·</div>
    <div id="nowTemp">--</div>
    <div id="nowCond">Loading weather…</div>
    <div class="facts">
      <div><span class="label">High / Low</span><b id="fHL">–</b></div>
      <div><span class="label">Sunrise</span><b id="fRise">–</b></div>
      <div><span class="label">Sunset</span><b id="fSet">–</b></div>
      <div><span class="label">Wind</span><b id="fWind">–</b></div>
      <div><span class="label">UV</span><b id="fUV">–</b></div>
    </div>
  </section>

  <section class="panel hours" id="hours"></section>
  <section class="panel days" id="days"></section>
  <section class="panel news" id="news"><div class="empty">Loading news…</div></section>
  <div class="status" id="status"></div>
</main>
<div id="veil"></div>

<script>
"use strict";
const WEATHER_EVERY = 15 * 60e3;   // weather refresh
const NEWS_EVERY = 10 * 60e3;      // news.json refresh (the GitHub job updates it every ~30 min)

let CFG = null;
const state = { weather: null, weatherAt: 0, news: null, newsAt: 0, weatherErr: false, newsErr: false };

// --- storage helpers: last good data survives reloads and internet drops ---
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

// --- WMO weather codes -> words + emoji (day, night) ---
const WMO = {
  0: ["Clear", "☀️", "🌙"], 1: ["Mostly clear", "🌤️", "🌙"], 2: ["Partly cloudy", "⛅", "☁️"], 3: ["Cloudy", "☁️", "☁️"],
  45: ["Fog", "🌫️", "🌫️"], 48: ["Freezing fog", "🌫️", "🌫️"],
  51: ["Light drizzle", "🌦️", "🌧️"], 53: ["Drizzle", "🌦️", "🌧️"], 55: ["Heavy drizzle", "🌧️", "🌧️"],
  56: ["Freezing drizzle", "🌧️", "🌧️"], 57: ["Freezing drizzle", "🌧️", "🌧️"],
  61: ["Light rain", "🌦️", "🌧️"], 63: ["Rain", "🌧️", "🌧️"], 65: ["Heavy rain", "🌧️", "🌧️"],
  66: ["Freezing rain", "🌧️", "🌧️"], 67: ["Freezing rain", "🌧️", "🌧️"],
  71: ["Light snow", "🌨️", "🌨️"], 73: ["Snow", "🌨️", "🌨️"], 75: ["Heavy snow", "❄️", "❄️"], 77: ["Snow grains", "🌨️", "🌨️"],
  80: ["Showers", "🌦️", "🌧️"], 81: ["Showers", "🌧️", "🌧️"], 82: ["Heavy showers", "⛈️", "⛈️"],
  85: ["Snow showers", "🌨️", "🌨️"], 86: ["Snow showers", "🌨️", "🌨️"],
  95: ["Thunderstorm", "⛈️", "⛈️"], 96: ["Thunderstorm, hail", "⛈️", "⛈️"], 99: ["Thunderstorm, hail", "⛈️", "⛈️"],
};
const wmo = (c, day = true) => { const w = WMO[c] || ["–", "·", "·"]; return { text: w[0], icon: day ? w[1] : w[2] }; };

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const deg = t => Math.round(t) + "°";

function fmtTime(d, withAmPm = true) {
  const h = d.getHours(), m = pad(d.getMinutes());
  if (CFG.clock24) return `${pad(h)}:${m}`;
  const h12 = h % 12 || 12;
  return withAmPm ? `${h12}:${m} ${h < 12 ? "am" : "pm"}` : `${h12}:${m}`;
}
// Open-Meteo returns local times like "2026-10-30T06:21" (already in the town's time zone).
const localTime = s => { const [h, m] = s.slice(11, 16).split(":").map(Number); const d = new Date(); d.setHours(h, m, 0, 0); return d; };
const hourLabel = s => { const h = +s.slice(11, 13); return CFG.clock24 ? pad(h) : `${h % 12 || 12}${h < 12 ? "a" : "p"}`; };
const toMin = hhmm => { const [h, m] = hhmm.split(":").map(Number); return h * 60 + m; };
function ago(ts) {
  const m = Math.round((Date.now() - ts) / 60e3);
  if (m < 1) return "just now";
  if (m < 60) return `${m} min ago`;
  const h = Math.round(m / 60);
  return h < 24 ? `${h} h ago` : `${Math.round(h / 24)} d ago`;
}
function uvWord(u) { return u < 3 ? "Low" : u < 6 ? "Moderate" : u < 8 ? "High" : u < 11 ? "Very high" : "Extreme"; }
function compass(d) { return ["N", "NE", "E", "SE", "S", "SW", "W", "NW"][Math.round(d / 45) % 8]; }

// --- clock + night dimming ---
function tick() {
  const now = new Date();
  const h = now.getHours();
  $("time").innerHTML = CFG.clock24 ? fmtTime(now) : `${fmtTime(now, false)}<span class="ampm">${h < 12 ? "AM" : "PM"}</span>`;
  $("date").textContent = now.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" });
  const mins = h * 60 + now.getMinutes(), s = toMin(CFG.nightStart), e = toMin(CFG.nightEnd);
  const night = s > e ? (mins >= s || mins < e) : (mins >= s && mins < e);
  document.body.classList.toggle("night", night);
  renderStatus();
}

// --- weather ---
async function loadWeather() {
  const p = new URLSearchParams({
    latitude: CFG.latitude, longitude: CFG.longitude, timezone: "auto", forecast_days: 6,
    temperature_unit: CFG.temperatureUnit, wind_speed_unit: CFG.windUnit,
    current: "temperature_2m,apparent_temperature,weather_code,is_day,wind_speed_10m,wind_direction_10m,wind_gusts_10m,uv_index",
    hourly: "temperature_2m,precipitation_probability,weather_code,is_day",
    daily: "weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max,precipitation_probability_max",
  });
  try {
    const r = await fetch("https://api.open-meteo.com/v1/forecast?" + p, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    state.weather = await r.json();
    state.weatherAt = Date.now();
    state.weatherErr = false;
    store.set("weather", { data: state.weather, at: state.weatherAt });
  } catch (e) {
    state.weatherErr = true;
  }
  renderWeather();
}

function renderWeather() {
  const w = state.weather;
  if (!w) return;
  const c = w.current, d = w.daily, hr = w.hourly, unit = w.current_units.wind_speed_10m;
  const cur = wmo(c.weather_code, c.is_day);
  $("nowIcon").textContent = cur.icon;
  $("nowTemp").innerHTML = `${Math.round(c.temperature_2m)}<small>°</small>`;
  $("nowCond").innerHTML = `${cur.text}<br><span>Feels like ${deg(c.apparent_temperature)}</span>`;
  $("fHL").textContent = `${deg(d.temperature_2m_max[0])} / ${deg(d.temperature_2m_min[0])}`;
  $("fRise").textContent = fmtTime(localTime(d.sunrise[0]), false);
  $("fSet").textContent = fmtTime(localTime(d.sunset[0]), false);
  $("fWind").textContent = `${Math.round(c.wind_speed_10m)} ${unit.replace("km/h", "km/h")} ${compass(c.wind_direction_10m)}`;
  $("fUV").textContent = `${Math.round(c.uv_index)} · ${uvWord(c.uv_index)}`;

  // 12 hours starting at the current hour. If the data is old, start at "now" anyway.
  const nowKey = (() => { const n = new Date(); return `${n.getFullYear()}-${pad(n.getMonth() + 1)}-${pad(n.getDate())}T${pad(n.getHours())}:00`; })();
  let start = hr.time.indexOf(nowKey);
  if (start < 0) start = hr.time.indexOf(c.time.slice(0, 13) + ":00");
  if (start < 0) start = 0;
  let html = "";
  for (let i = start; i < start + 12 && i < hr.time.length; i++) {
    const p = hr.precipitation_probability[i] ?? 0;
    html += `<div class="hour${i === start ? " cur" : ""}">
      <div class="t">${i === start ? "Now" : hourLabel(hr.time[i])}</div>
      <div class="i">${wmo(hr.weather_code[i], hr.is_day[i]).icon}</div>
      <div class="deg">${deg(hr.temperature_2m[i])}</div>
      <div class="bar"><i style="height:${Math.max(p, 2)}%"></i></div>
      <div class="p">${p}%</div></div>`;
  }
  $("hours").innerHTML = html;

  // Next 4 days (skip today; today is in the panel above).
  const todayKey = nowKey.slice(0, 10);
  let first = d.time.findIndex(t => t > todayKey);
  if (first < 0) first = 1;
  html = "";
  for (let i = first; i < first + 4 && i < d.time.length; i++) {
    const dt = new Date(d.time[i] + "T12:00");
    html += `<div class="day">
      <div class="n">${dt.toLocaleDateString(undefined, { weekday: "short" })}</div>
      <div class="i">${wmo(d.weather_code[i]).icon}</div>
      <div class="hl">${deg(d.temperature_2m_max[i])} <span>${deg(d.temperature_2m_min[i])}</span></div>
      <div class="p">💧 ${d.precipitation_probability_max[i] ?? 0}%</div></div>`;
  }
  $("days").innerHTML = html;
}

// --- news (news.json is written by the GitHub Action next to this page) ---
async function loadNews() {
  try {
    const r = await fetch("news.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    state.news = await r.json();
    state.newsAt = Date.now();
    state.newsErr = false;
    store.set("news", { data: state.news, at: state.newsAt });
  } catch (e) {
    state.newsErr = true;
  }
  renderNews();
}

function renderNews() {
  const n = state.news;
  if (!n || !n.items || !n.items.length) {
    $("news").innerHTML = `<div class="empty">${state.newsErr ? "News isn't available yet." : "Loading news…"}</div>`;
    return;
  }
  const esc = s => s.replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
  $("news").innerHTML = n.items.slice(0, CFG.headlines).map(it => `
    <div class="item"><div class="h">${esc(it.title)}</div>
    <div class="m"><b>${esc(it.source)}</b>${it.time ? " · " + ago(Date.parse(it.time)) : ""}</div></div>`).join("");
}

// --- "last updated" line; turns amber when data is old or the internet is down ---
function renderStatus() {
  if (!CFG) return;
  const parts = [], now = Date.now();
  let stale = false;
  if (state.weatherAt) {
    const old = now - state.weatherAt > WEATHER_EVERY * 2.5;
    stale ||= old || state.weatherErr;
    parts.push(`Weather updated ${fmtTime(new Date(state.weatherAt))}`);
  }
  if (state.newsAt) {
    const old = now - state.newsAt > NEWS_EVERY * 2.5;
    stale ||= old || state.newsErr;
    parts.push(`news ${fmtTime(new Date(state.newsAt))}`);
  }
  const el = $("status");
  el.textContent = (stale ? "⚠ No connection — showing last data · " : "") + parts.join(" · ");
  el.classList.toggle("stale", stale);
}

async function start() {
  try { CFG = await (await fetch("config.json", { cache: "no-cache" })).json(); store.set("config", CFG); }
  catch { CFG = store.get("config"); }
  if (!CFG) { $("nowCond").textContent = "Can't load settings (config.json)."; return; }
  $("town").textContent = CFG.town;

  // Show the last saved data straight away, then refresh.
  const w = store.get("weather"), n = store.get("news");
  if (w) { state.weather = w.data; state.weatherAt = w.at; renderWeather(); }
  if (n) { state.news = n.data; state.newsAt = n.at; renderNews(); }

  tick();
  setInterval(tick, 1000);
  loadWeather(); setInterval(loadWeather, WEATHER_EVERY);
  loadNews(); setInterval(loadNews, NEWS_EVERY);
  setInterval(renderNews, 60e3);                  // keep "x min ago" current
  setInterval(() => { if (state.weather) renderWeather(); }, 5 * 60e3); // move the hour strip along
  // Reload once a day at 04:00 to pick up page changes and clear any memory build-up.
  setInterval(() => { const d = new Date(); if (d.getHours() === 4 && d.getMinutes() === 0 && navigator.onLine) location.reload(); }, 60e3);
}

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
start();
</script>
</body>
</html>
