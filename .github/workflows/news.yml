name: Update news

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub often runs it a few minutes late)
  workflow_dispatch:          # lets you run it by hand from the Actions tab
  push:
    paths: ["config.json", "scripts/**"]

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_news.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      # Committing each run also counts as repo activity, which stops GitHub
      # from pausing the schedule after 60 quiet days.
      - name: Commit news.json
        run: |
          git config user.name "news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet && exit 0
          git commit -m "Update news"
          git pull --rebase
          git push
